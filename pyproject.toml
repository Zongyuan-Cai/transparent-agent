[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transparent-agent"
version = "0.1.0"
description = "A lightweight terminal coding agent"
requires-python = ">=3.10"
dependencies = ["openai>=1.0,<3", "httpx>=0.25,<1", "PyYAML>=6,<7", "jsonschema>=4.18,<5"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
transparent-agent = "transparent_agent.cli:main"

[tool.setuptools.packages.find]
include = ["transparent_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
